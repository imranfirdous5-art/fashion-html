<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>

    <!-- stylesheet-css -->
     <link rel="stylesheet" href="css/style.css">

</head>
<body class="bg-color">
    <div class="login-container">
        <p>Signup-Form</p>
        <form action="" onsubmit="signup(event)">
            <div class="div-style">
                <label for="name">Name:</label><br>
                <input type="text" id="name" placeholder="enter name here..." class="input-style">
            </div>
            <div class="div-style">
                <label for="email">Email:</label><br>
                <input type="email" id="email" placeholder="enter email here..." class="input-style">
            </div>
            <div class="div-style">
                <label for="password">Password:</label><br>
                <input type="password" id="password" placeholder="enter password here..." class="input-style">
            </div>
            <div>
                <button type="submit" class="login-button">Signup</button>
                <button class="login-button">
                    <a href="login.html">back</a>
                </button>
            </div>
            
        </form>
        <br><br>
        
    </div>
    

    <script src="signup.js"></script>
</body>
</html>
